<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverbend Family Dental — Book an appointment</title>
</head>
<body>
<nav aria-label="Primary">
  <a href="/">Home</a>
  <a href="/services">Services</a>
  <a href="/book">Book</a>
</nav>
<main>
  <h1>Book an appointment</h1>
  <p style="color:#5a5a5a; background-color:#ffffff; font-size:16px">New patients welcome. Most insurance accepted.</p>
  <h2>Choose a time</h2>
  <form action="/book">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
    <span>Preferred day</span>
    <select name="day">
      <option>Monday</option><option>Tuesday</option>
    </select>
    <button type="submit">Request appointment</button>
  </form>
  <h2>Our office</h2>
  <img src="office.jpg" alt="Office">
  <p>Questions? <a href="/faq">Read more</a></p>
  <h4>Hours</h4>
  <p>Mon–Fri 8–5</p>
</main>
</body>
</html>
